[project]
name = "analytics-mesh"
version = "0.1.0"
description = "Query-first local analytics mesh"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mesh-common",
    "mesh-node",
    "mesh-plane",
    "mesh-client",
    "mesh-connector-local-files",
    "mesh-connector-postgres",
    "mesh-engine-duckdb",
    "mesh-engine-polars",
    "mesh-mcp",
]

[project.scripts]
mesh = "mesh_client.cli:app"
mesh-node = "mesh_node.__main__:main"
mesh-plane = "mesh_plane.__main__:main"
mesh-mcp = "mesh_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = [
    "packages/mesh_common",
    "packages/mesh_node",
    "packages/mesh_plane",
    "packages/mesh_client",
    "packages/mesh_mcp",
    "plugins/connectors/local_files",
    "plugins/connectors/postgres",
    "plugins/engines/duckdb_engine",
    "plugins/engines/polars_engine",
]

[tool.uv.sources]
mesh-common = { workspace = true }
mesh-node = { workspace = true }
mesh-plane = { workspace = true }
mesh-client = { workspace = true }
mesh-mcp = { workspace = true }
mesh-connector-local-files = { workspace = true }
mesh-connector-postgres = { workspace = true }
mesh-engine-duckdb = { workspace = true }
mesh-engine-polars = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: optional live Postgres (MESH_POSTGRES_DSN or testcontainers)",
    "ui: browser UI tests (Playwright; run with pytest -m ui after playwright install chromium)",
]
