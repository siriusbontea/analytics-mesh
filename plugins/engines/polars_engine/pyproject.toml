[project]
name = "mesh-engine-polars"
version = "0.1.0"
description = "Optional Polars dataframe engine for Analytics Mesh"
requires-python = ">=3.12"
dependencies = [
    "mesh-common",
    "mesh-engine-duckdb",
    "polars>=1.9",
    "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
