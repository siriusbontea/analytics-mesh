name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Syntax-check deep-smoke
        run: bash -n scripts/deep-smoke.sh
      - name: Run tests
        run: uv run pytest

  deep-smoke:
    name: deep-smoke (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Deep smoke (temp node)
        run: ./scripts/deep-smoke.sh --start
