# Optional OpenAI-compatible providers (Ollama / LM Studio / vLLM / OpenRouter).
# Analytics work with zero LLM configured. Point node.yaml at this file with
# `models_path:` or copy the `main` / `auxiliary` / `fallback` slots under `models:`.
# Do not put API keys here; use api_key_env. Probe with GET {base_url}/models.
main:
  provider: local
  base_url: http://127.0.0.1:11434/v1
  model: qwen2.5-coder:14b
auxiliary:
  provider: local
  base_url: http://127.0.0.1:11434/v1
  model: qwen2.5:7b
fallback:
  - provider: frontier
    base_url: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-4
    api_key_env: OPENROUTER_API_KEY
policy:
  default_mode: local_only
  allow_frontier_analytics: []
