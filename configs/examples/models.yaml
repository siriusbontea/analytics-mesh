# Optional OpenAI-compatible providers (Ollama / LM Studio / vLLM / OpenRouter).
# Analytics work with zero LLM configured. Default node.yaml leaves this unset.
#
# Enable Propose SQL locally:
#   1. Install Ollama (https://ollama.com) and run `ollama serve`, or start
#      LM Studio's local OpenAI-compatible server.
#   2. Pull a model you actually have, for example: `ollama pull qwen2.5-coder:7b`
#      The `model:` ids below are placeholders — set them to a tag from
#      GET {base_url}/models (or `./scripts/check-models.sh`).
#   3. Serve with configs/examples/node-with-models.yaml (`models_path:` here),
#      or copy these slots under `models:` in a node config.
#
# Keep policy.default_mode: local_only so the frontier fallback does not fire
# unless you explicitly set a principal to allow_frontier.
# Do not put API keys here; use api_key_env.
# Probe: GET http://127.0.0.1:11434/v1/models
main:
  provider: local
  base_url: http://127.0.0.1:11434/v1
  model: qwen2.5-coder:14b
auxiliary:
  provider: local
  base_url: http://127.0.0.1:11434/v1
  model: qwen2.5:7b
fallback:
  - provider: frontier
    base_url: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-4
    api_key_env: OPENROUTER_API_KEY
policy:
  default_mode: local_only
  allow_frontier_analytics: []
