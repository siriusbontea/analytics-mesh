# Default listen is localhost only. Do not set listen_host: 0.0.0.0.
# For a real data directory, copy configs/examples/node-real-data.yaml.example
# and change connectors[local_files].root (keep sensitivity labels accurate).
node_id: local-dev
artifact_dir: var/artifacts
receipt_db: var/receipts.sqlite
identity_key_path: var/local-dev.identity.pem
listen_host: 127.0.0.1
listen_port: 8080
connectors:
  - id: local_files
    type: local_files
    root: data/samples
    labels: [personal]
analytics_dir: analytics
policy_path: configs/examples/policy.yaml
limits:
  default_row_limit: 10000
  max_row_limit: 100000
  query_timeout_seconds: 30
artifacts:
  max_bytes_per_file: 104857600   # 100 MiB per parquet
  max_total_bytes: 1073741824     # 1 GiB total
  retention_days: 7
  max_files: 200
# models: leave unset so analytics runs with zero LLM configured.
# For optional Propose SQL, use configs/examples/node-with-models.yaml
# (local), node-with-grok.yaml (xAI Grok), or node-with-local-then-grok.yaml.
# models_path: configs/examples/models.yaml
