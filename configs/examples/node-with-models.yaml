# Same as node.yaml, plus optional local models for Propose SQL / explain.
# Default configs/examples/node.yaml stays LLM-free.
#
# 1. Start Ollama (`ollama serve`) or LM Studio's OpenAI-compatible server.
# 2. `ollama pull <tag>` and set `model:` in models.yaml to a tag you actually
#    have (example ids there are placeholders). Probe with:
#      ./scripts/check-models.sh
#      # or: curl -sS http://127.0.0.1:11434/v1/models
# 3. uv run mesh serve --config configs/examples/node-with-models.yaml
#
# models.yaml keeps policy.default_mode: local_only so the frontier fallback
# does not fire unless you explicitly allow it.
node_id: local-dev
artifact_dir: var/artifacts
receipt_db: var/receipts.sqlite
identity_key_path: var/local-dev.identity.pem
listen_host: 127.0.0.1
listen_port: 8080
connectors:
  - id: local_files
    type: local_files
    root: data/samples
    labels: [personal]
analytics_dir: analytics
policy_path: configs/examples/policy.yaml
limits:
  default_row_limit: 10000
  max_row_limit: 100000
  query_timeout_seconds: 30
artifacts:
  max_bytes_per_file: 104857600   # 100 MiB per parquet
  max_total_bytes: 1073741824     # 1 GiB total
  retention_days: 7
  max_files: 200
models_path: configs/examples/models.yaml
