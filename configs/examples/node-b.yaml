node_id: node-b
artifact_dir: var/node-b/artifacts
receipt_db: var/node-b/receipts.sqlite
identity_key_path: var/node-b/identity.pem
listen_host: 127.0.0.1
listen_port: 8082
labels: [personal]
connectors:
  - id: local_files
    type: local_files
    root: data/samples/node-b
    labels: [personal]
limits:
  default_row_limit: 10000
  max_row_limit: 100000
  query_timeout_seconds: 30
plane:
  url: http://127.0.0.1:8090
  token: demo-pair-token
  register_on_start: true
  public_endpoint: http://127.0.0.1:8082
