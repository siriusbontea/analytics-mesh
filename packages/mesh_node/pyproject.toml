[project]
name = "mesh-node"
version = "0.1.0"
description = "Analytics Mesh node runtime"
requires-python = ">=3.12"
dependencies = [
    "mesh-common",
    "mesh-connector-local-files",
    "mesh-engine-duckdb",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
