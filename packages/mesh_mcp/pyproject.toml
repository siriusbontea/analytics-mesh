[project]
name = "mesh-mcp"
version = "0.1.0"
description = "Analytics-only MCP adapter for Analytics Mesh"
requires-python = ">=3.12"
dependencies = [
    "mesh-common",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.9",
]

[project.scripts]
mesh-mcp = "mesh_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
