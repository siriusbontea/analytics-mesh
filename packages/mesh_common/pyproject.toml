[project]
name = "mesh-common"
version = "0.1.0"
description = "Shared schemas, receipts, and plugin protocols for Analytics Mesh"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
