[project]
name = "mesh-client"
version = "0.1.0"
description = "Analytics Mesh CLI"
requires-python = ">=3.12"
dependencies = [
    "mesh-node",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
mesh = "mesh_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
