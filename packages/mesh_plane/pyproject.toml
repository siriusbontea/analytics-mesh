[project]
name = "mesh-plane"
version = "0.1.0"
description = "Analytics Mesh thin control plane"
requires-python = ">=3.12"
dependencies = [
    "mesh-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
